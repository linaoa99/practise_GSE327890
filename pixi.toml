[workspace]
name = "nf-core-rnaseq-practice"
version = "0.1.0"
description = "Practising nf-core/rnaseq using Pixi and DevContainers"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[activation.env]
NXF_JAVA_HOME = "$CONDA_PREFIX"
NXF_HOME = "$PIXI_PROJECT_ROOT/.nextflow-home"

[dependencies]
python = "3.12.*"
nextflow = ">=25.10"
nf-core = "*"
openjdk = "21.*"